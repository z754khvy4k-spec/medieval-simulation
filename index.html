<script>
/*
 MEDIEVAL SIMULATION V2
 Core principle: markets are accounting systems, not decorative counters.
 Every unit sold is removed from stock. Every purchase costs money.
 Unmet demand is recorded. Prices respond to inventory coverage + unmet demand.
 Food shortages reduce consumption, increase hunger, damage health, and can kill.
 Production is constrained by labor and inputs.
*/
const N=["Aldric","Agnes","Beatrice","Bernard","Cecily","Edmund","Eleanor","Geoffrey","Hugh","Isabel","John","Katherine","Martin","Matilda","Nicholas","Oswin","Peter","Robert","Simon","Thomas","Walter","William"];
const S=["Ashford","Baker","Black","Cooper","Fletcher","Harper","Miller","Parker","Reed","Smith","Taylor","Turner","Ward","Webb","Wright"];
const JOBS=["farmer","miller","baker","weaver","smith","carpenter","merchant","innkeeper","laborer","guard","priest","scribe","fisher"];

const GOODS={
 grain:{base:1.00,producer:"farmer",food:true, calories:1, maxPrice:12},
 flour:{base:1.70,producer:"miller",input:"grain",inputQty:1.15,food:true,calories:.9,maxPrice:16},
 bread:{base:2.40,producer:"baker",input:"flour",inputQty:1.1,food:true,calories:.85,maxPrice:22},
 cloth:{base:4.50,producer:"weaver",input:"wool",inputQty:1,food:false,maxPrice:25},
 tools:{base:6.00,producer:"smith",input:"iron",inputQty:.35,food:false,maxPrice:35},
 wood:{base:1.80,producer:"carpenter",food:false,maxPrice:14},
 fish:{base:2.20,producer:"fisher",food:true,calories:1.15,maxPrice:18},
 wool:{base:1.40,producer:"farmer",food:false,maxPrice:12},
 iron:{base:3.80,producer:"smith",food:false,maxPrice:18}
};

let W,active="overview",timer=null;
const r=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function npc(i){
  const job=pick(JOBS);
  return {
    id:i,name:pick(N)+" "+pick(S),age:Math.floor(r(16,72)),job,
    wealth:Math.max(2,r(8,80)),food:r(1.5,5),energy:r(.65,1),
    health:r(.72,1),hunger:r(0,.25),risk:r(.05,.8),law:r(.2,.9),
    productivity:r(.75,1.25),goal:pick(["earn wealth","raise family","gain status","protect household","avoid hunger","expand trade"]),
    memory:[],knowledge:{},alive:true,employed:true,daysStarved:0
  };
}
function init(){
 W={
   day:1,year:1284,people:[],markets:{},orgs:[
    {name:"Merchants' Guild",type:"guild",members:34,power:.48},
    {name:"Weavers' Guild",type:"guild",members:27,power:.31},
    {name:"Town Watch",type:"state",members:42,power:.55}
   ],
   crimes:[],events:[],treasury:850,tax:.08,running:false,
   shortageDays:0,totalFoodConsumed:0,totalFoodUnmet:0
 };
 for(let i=0;i<1200;i++)W.people.push(npc(i));

 for(const g in GOODS){
   const base=GOODS[g].base;
   W.markets[g]={
     price:base,stock:g==="grain"?850:r(250,650),
     demand:0,sales:0,unmet:0,production:0,
     moneySpent:0,prevStock:0,daysOfSupply:30
   };
 }
 // Give producers and merchants slightly more working capital.
 W.people.forEach(p=>{if(["farmer","miller","baker","merchant"].includes(p.job))p.wealth+=r(10,30)});
 log("V2 begins: inventories, purchases, unmet demand, production inputs and starvation are economically connected.");
 render();
}
function log(x){
 W.events.unshift("["+W.year+" / day "+W.day+"] "+x);
 if(W.events.length>300)W.events.pop();
}
function wageFor(job){
 return {farmer:1.05,miller:1.35,baker:1.4,weaver:1.3,smith:1.6,carpenter:1.25,merchant:1.1,innkeeper:1.0,laborer:.8,guard:.95,priest:.9,scribe:1.0,fisher:1.05}[job]||.8;
}
function productionStep(){
  // Primary production first.
  const counts={}; W.people.forEach(p=>counts[p.job]=(counts[p.job]||0)+1);
  // Reset daily production.
  for(const g in GOODS)W.markets[g].production=0;

  const primary={
    farmer:[["grain",.72],["wool",.08]],
    fisher:[["fish",.48]],
    carpenter:[["wood",.45]],
    smith:[["iron",.12]]
  };
  for(const job in primary){
    for(const p of W.people.filter(x=>x.job===job && x.alive)){
      for(const [g,q] of primary[job]){
        const out=q*p.productivity*r(.85,1.15);
        W.markets[g].stock+=out;
        W.markets[g].production+=out;
        p.wealth+=wageFor(job)*.45; // producer earns from sale later; this is a subsistence/working payment
      }
    }
  }

  // Processors can only produce if input inventory exists.
  const processors=[
    ["miller","flour","grain",1.15,.62],
    ["baker","bread","flour",1.10,.58],
    ["weaver","cloth","wool",1.00,.24],
    ["smith","tools","iron",.35,.11]
  ];
  for(const [job,outGood,inGood,inputPerUnit,outPerWorker] of processors){
    for(const p of W.people.filter(x=>x.job===job && x.alive)){
      const desired=outPerWorker*p.productivity*r(.9,1.1);
      const possible=W.markets[inGood].stock/inputPerUnit;
      const actual=Math.min(desired,possible);
      W.markets[inGood].stock-=actual*inputPerUnit;
      W.markets[outGood].stock+=actual;
      W.markets[outGood].production+=actual;
      if(actual<desired*.7 && desired>0.01){
        p.memory.push({type:"input shortage",good:inGood,day:W.day});
      }
      // Processor gets a wage, but the business also pays for inputs through inventory.
      p.wealth+=wageFor(job)*.45;
    }
  }
}
function demandProfile(p){
  // Desired food is hunger-dependent. Adults need ~0.13 food units/day.
  const foodNeed=.125*(p.age<18?.75:p.age>60?.9:1);
  const urgency=1+3*p.hunger;
  const desiredFood=foodNeed*urgency;
  const nonFood=.018*(1+(p.goal==="gain status"?.6:0));
  return {food:desiredFood,nonFood};
}
function buyGood(g,desired,p){
  const m=W.markets[g];
  if(desired<=0 || m.stock<=0 || p.wealth<=0)return 0;
  const affordable=p.wealth/m.price;
  const qty=Math.min(desired,m.stock,affordable);
  if(qty<=0)return 0;
  m.stock-=qty;
  m.sales+=qty;
  m.moneySpent+=qty*m.price;
  p.wealth-=qty*m.price;
  return qty;
}
function marketDemandStep(){
  for(const g in GOODS){
    const m=W.markets[g];
    m.prevStock=m.stock;m.demand=0;m.sales=0;m.unmet=0;m.moneySpent=0;
  }

  let foodWanted=0,foodBought=0;
  // Residents buy food first. They choose among available food based on price,
  // so a shortage in one food can shift demand to another.
  const foodGoods=["bread","grain","fish"].filter(g=>W.markets[g]);
  for(const p of W.people){
    if(!p.alive)continue;
    const d=demandProfile(p);
    foodWanted+=d.food;
    let remaining=d.food;

    const choices=foodGoods.slice().sort((a,b)=>W.markets[a].price-W.markets[b].price);
    for(const g of choices){
      if(remaining<=0)break;
      const bought=buyGood(g,remaining,p);
      remaining-=bought*GOODS[g].calories;
      foodBought+=bought*GOODS[g].calories;
    }
    const actualFood=Math.max(0,d.food-remaining);
    p.food=clamp(p.food+actualFood,0,5);
    p.hunger=clamp(p.hunger+(d.food-actualFood)*.75-actualFood*.08,0,2);
    if(actualFood<d.food*.85)p.daysStarved++;
    else p.daysStarved=Math.max(0,p.daysStarved-1);

    // Basic non-food consumption: cloth/tools/wood. Not essential for survival,
    // but shortages affect living standards and productive capacity later.
    const nonFood=d.nonFood;
    const preferred=pick(["cloth","wood","tools"]);
    buyGood(preferred,nonFood,p);
  }

  for(const g in GOODS){
    const m=W.markets[g];
    // Demand is actual desired quantity, not an arbitrary multiple of consumption.
    if(GOODS[g].food){
      // Reconstruct food demand from the market-clearing pass.
      m.demand=foodWanted*(1/(foodGoods.length||1));
    } else {
      m.demand=W.people.length*.018;
    }
    m.unmet=Math.max(0,m.demand-m.sales);
  }
  W.totalFoodConsumed+=foodBought;
  W.totalFoodUnmet+=Math.max(0,foodWanted-foodBought);
  return {foodWanted,foodBought};
}
function updatePrices(){
  for(const g in GOODS){
    const m=W.markets[g],spec=GOODS[g];
    const dailyDemand=Math.max(.1,m.demand);
    const coverage=m.stock/dailyDemand;
    m.daysOfSupply=coverage;

    // Strong response to shortages. Excess inventory pushes price down.
    const shortagePressure=clamp((1.8-coverage)/1.8,-1,1);
    const unmetPressure=clamp(m.unmet/Math.max(1,dailyDemand),0,1);
    let change=.045*shortagePressure + .055*unmetPressure;

    // Persistent surplus creates discounting.
    if(coverage>45)change-=.035;
    else if(coverage>25)change-=.015;

    // Prices are sticky but respond materially over time.
    change+=r(-.006,.006);
    m.price=clamp(m.price*(1+change),spec.base*.30,spec.maxPrice);

    // If the market is completely empty, price jumps faster next day.
    if(m.stock<.001 && m.unmet>0)m.price=clamp(m.price*1.08,spec.base*.30,spec.maxPrice);
  }
}
function distributeProducerRevenue(){
  // Buyers' money is already removed from residents. Distribute most of market
  // spending to the occupations that produced the sold good.
  for(const g in GOODS){
    const m=W.markets[g],producer=GOODS[g].producer;
    const workers=W.people.filter(p=>p.job===producer && p.alive);
    if(!workers.length)continue;
    const payout=m.moneySpent*.72;
    const each=payout/workers.length;
    workers.forEach(p=>p.wealth+=each);
    W.treasury+=m.moneySpent*W.tax*.04;
  }
}
function healthStep(){
  let deaths=0;
  const foodShort=W.markets.grain.stock+W.markets.bread.stock+W.markets.fish.stock<Math.max(1,W.people.length*.25);
  if(foodShort)W.shortageDays++;else W.shortageDays=Math.max(0,W.shortageDays-1);

  for(const p of W.people){
    if(!p.alive)continue;
    p.energy=clamp(p.energy-r(.008,.018),0,1);
    p.energy=clamp(p.energy+.035,0,1);

    // Hunger is a real physiological state. Sustained starvation damages health.
    if(p.hunger>.25)p.health-=.0015*(p.hunger*2);
    if(p.hunger>.65)p.health-=.004*(1+p.hunger);
    if(p.daysStarved>3)p.health-=.002;
    if(p.hunger<.12)p.health+=.0005;

    // Aging.
    if(p.age>55)p.health-=.00025;
    if(p.health<=0){
      p.alive=false;deaths++;
    }
  }
  if(deaths)log(deaths+" residents died from disease, age, or prolonged deprivation.");
  if(foodShort && W.day%3===0)log("FOOD SHORTAGE: aggregate food inventories are critically low.");
}
function crime(p){
  const type=pick(["theft","smuggling","fraud","burglary"]),value=Math.round(r(2,18));
  const detected=Math.random()<(.08+(1-p.law)*.22);
  W.crimes.unshift({year:W.year,day:W.day,type,actor:p.name,value,detected});
  p.memory.push({type:"crime",day:W.day});
  if(detected){p.law=Math.max(.05,p.law-.04);log(p.name+" was caught attempting "+type+".");}
  else{p.wealth+=value;log(type+" occurred; the culprit escaped detection.");}
  if(type==="theft"&&!W.orgs.some(o=>o.type==="criminal"))
    W.orgs.push({name:"Northside Thieves",type:"criminal",members:5,power:.08});
}
function tick(){
  W.day++;
  if(W.day>365){W.day=1;W.year++;annual();}

  productionStep();
  const flow=marketDemandStep();
  distributeProducerRevenue();
  updatePrices();

  // Starving people become more desperate.
  for(const p of W.people){
    if(!p.alive)continue;
    if(p.hunger>.8 && Math.random()<p.risk*.035)crime(p);
    if(Math.random()<.0015){
      p.memory.push({type:"grain price",value:W.markets.grain.price,day:W.day});
      if(p.memory.length>18)p.memory.shift();
    }
  }

  healthStep();

  // Information propagates through a limited attention channel.
  if(Math.random()<.20){
    const price=W.markets.grain.price;
    for(let i=0;i<Math.floor(r(2,12));i++){
      const p=pick(W.people.filter(x=>x.alive));
      p.knowledge.grain={value:price,age:0};
    }
  }
  for(const p of W.people){
    for(const k in p.knowledge)p.knowledge[k].age++;
    if(Object.keys(p.knowledge).length>6){
      const oldest=Object.entries(p.knowledge).sort((a,b)=>b[1].age-a[1].age)[0][0];
      delete p.knowledge[oldest];
    }
  }

  for(const o of W.orgs){
    o.members=Math.max(3,Math.round(o.members*(1+r(-.004,.008))));
    o.power=clamp(o.power+r(-.003,.004),.05,1);
  }
  if(Math.random()<.015)politicsEvent();
  if(Math.random()<.012)emerge();

  if(flow.foodBought<flow.foodWanted*.6 && W.day%2===0)
    log("Food rationing: only "+(flow.foodBought/Math.max(.1,flow.foodWanted)*100).toFixed(0)+"% of desired food was purchased.");
}
function annual(){
  const births=Math.round(W.people.filter(p=>p.alive).length*.012);
  let deaths=0;
  W.people=W.people.filter(p=>{if(!p.alive){deaths++;return false}return true});
  for(let i=0;i<births;i++)W.people.push(npc(W.people.length+Math.floor(Math.random()*99999)));
  W.treasury+=W.people.length*r(.3,.8)*W.tax;
  log("Annual accounting: "+births+" births, "+deaths+" deaths. Treasury: "+W.treasury.toFixed(0)+" silver.");
}
function politicsEvent(){

function householdKey(p){return "H"+Math.floor(p.id/4)}
function uiHouseholds(){
  const map={};
  for(const p of W.people){
    const k=householdKey(p);
    if(!map[k])map[k]={id:k,members:[],wealth:0,food:0,avgHealth:0,avgHunger:0,risk:0,workers:0,children:0,goals:{}};
    const h=map[k]; h.members.push(p); h.wealth+=p.wealth; h.food+=p.food;
    h.avgHealth+=p.health; h.avgHunger+=p.hunger; h.risk+=p.risk;
    if(p.age<18)h.children++; else if(p.employed)h.workers++;
    h.goals[p.goal]=(h.goals[p.goal]||0)+1;
  }
  return Object.values(map).map(h=>{
    const n=h.members.length;
    h.avgHealth/=n;h.avgHunger/=n;h.risk/=n;
    h.primaryGoal=Object.entries(h.goals).sort((a,b)=>b[1]-a[1])[0]?.[0]||"none";
    h.security=clamp((h.wealth/30)*(1-h.avgHunger/2)*(h.avgHealth/100),0,5);
    return h;
  });
}
function uiPerson(id){return W.people.find(p=>String(p.id)===String(id))}
function uiTownStats(index){
  const people=W.people.filter(p=>((p.id+index*17)%3)===index);
  const wealth=people.reduce((s,p)=>s+p.wealth,0);
  return {people,wealth,avgWealth:wealth/Math.max(1,people.length),avgHealth:people.reduce((s,p)=>s+p.health,0)/Math.max(1,people.length),avgHunger:people.reduce((s,p)=>s+p.hunger,0)/Math.max(1,people.length)};
}
let UI={history:{days:[],grain:[],bread:[],population:[],wealth:[],hunger:[],crime:[]}};
function captureHistory(){
  if(!W)return;
  UI.history.days.push(W.year+"-"+W.day);
  UI.history.grain.push(W.markets.grain.price);
  UI.history.bread.push(W.markets.bread.price);
  UI.history.population.push(W.people.length);
  UI.history.wealth.push(W.people.reduce((a,p)=>a+p.wealth,0)/Math.max(1,W.people.length));
  UI.history.hunger.push(W.people.filter(p=>p.hunger>.65).length);
  UI.history.crime.push(W.crimes.length);
  for(const k in UI.history)if(UI.history[k].length>240)UI.history[k].shift();
}
